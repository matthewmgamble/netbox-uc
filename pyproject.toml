[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-uc"
version = "0.1.1"
description = "Unified Communications inventory and lifecycle management for NetBox"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Matthew Gamble"},
]
dependencies = [
    "msal>=1.28.0",
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/matthewmgamble/netbox-uc"

[tool.setuptools.packages.find]
include = ["netbox_uc*"]
